<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookFun — Open Source eBook &amp; Comic Platform</title>
<meta name="description" content="BookFun is an open source eBook and comic platform: upload, manage, and read EPUB, PDF, CBR, CBZ, and CB7 books in your browser.">
<style>
  :root {
    --bg: #f7f5f1;
    --fg: #2b2926;
    --muted: #6f6a62;
    --accent: #8b5e34;
    --card: #ffffff;
    --border: #e4dfd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1815;
      --fg: #ece7df;
      --muted: #a39c91;
      --accent: #d9a05b;
      --card: #24211d;
      --border: #38342e;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    line-height: 1.6;
  }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: 2.5rem; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); margin: 0.5rem 0 2rem; font-size: 1.1rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    text-align: left;
  }
  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.5rem;
    font-family: system-ui, -apple-system, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover, a:focus { text-decoration: underline; }
  .formats { color: var(--muted); font-size: 0.95rem; margin-top: 0.75rem; }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Book<span>Fun</span></h1>
  <p class="tagline">An open source eBook and comic platform for uploading, managing, and reading books in your browser.</p>

  <div class="card">
    <h2>Source Code</h2>
    <p><a href="https://bitbucket.org/drosser9/bookfun">bitbucket.org/drosser9/bookfun</a></p>
    <p class="formats">EPUB · PDF · CBR · CBZ · CB7 — Python&nbsp;3 &amp; Django</p>
  </div>

  <div class="card">
    <h2>Contact</h2>
    <p><a href="mailto:admin@bookfunproject.org">admin@bookfunproject.org</a></p>
  </div>

  <footer>&copy; 2026 The BookFun Project · MIT License</footer>
</main>
</body>
</html>
